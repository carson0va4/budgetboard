<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a ledger sidebar beside a grid of linked widgets; figures lead, set in tabular numerals. */
:root {
  --bg: #edf1f0; --surface: #fcfcfb; --surface-2: #f2f5f4; --ink: #0f1a19; --ink-2: #455452; --ink-3: #66746f; --ink-4: #b7c2bf;
  --line: #d9e1df; --grid: #e6ecea;
  --accent: #0e7f81; --accent-ink: #ffffff;
  --good: #0a7a0a; --warn: #fab219; --warn-ink: #8a5800; --bad: #c93434;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --s-other: #9aa5a3;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1312; --surface: #171c1b; --surface-2: #1e2423; --ink: #ebf0ee; --ink-2: #b2bebb; --ink-3: #8b9895; --ink-4: #4a5654;
    --line: #2a3331; --grid: #232b29; --accent: #2db3b0; --accent-ink: #03201f;
    --good: #3cc93c; --warn: #fab219; --warn-ink: #fab219; --bad: #ec7474;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767; --s-other: #6d7876;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1312; --surface: #171c1b; --surface-2: #1e2423; --ink: #ebf0ee; --ink-2: #b2bebb; --ink-3: #8b9895; --ink-4: #4a5654;
  --line: #2a3331; --grid: #232b29; --accent: #2db3b0; --accent-ink: #03201f;
  --good: #3cc93c; --warn: #fab219; --warn-ink: #fab219; --bad: #ec7474;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767; --s-other: #6d7876;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 28px; line-height: 1.15; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
p { margin: 0; }
.num, td.amt, .amt { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Shell */
.shell { display: grid; grid-template-columns: 216px 1fr; min-height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand-mark span { width: 12px; height: 12px; border: 2px solid var(--accent-ink); border-radius: 3px; border-top-width: 5px; }
.brand b { font-family: var(--font-display); font-size: 18px; font-weight: 650; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--ink); }
.nav a[aria-current="page"] .nav-dot { background: var(--accent); }
.nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-4); flex: none; }
.side-foot { margin-top: auto; padding: 0 8px; font-size: 12.5px; color: var(--ink-3); display: grid; gap: 6px; }
.main { padding: 26px 32px 60px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.top p { color: var(--ink-3); margin-top: 4px; max-width: 62ch; }
.top-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* Controls */
.btn { font: 500 14px/1 var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 14px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-4); background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
input, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
input[type="color"] { padding: 2px; width: 44px; height: 36px; }
input[type="range"] { accent-color: var(--accent); padding: 0; border: 0; background: none; box-shadow: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 3px; background: var(--surface-2); gap: 2px; }
.seg button { font: 500 13.5px/1 var(--font-body); border: 0; background: none; color: var(--ink-2); padding: 7px 12px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

/* Status chip */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); }
.chip.ok::before { background: var(--good); }
.chip.warn::before { background: var(--warn); }
.chip.bad::before { background: var(--bad); }

/* Cards & widgets */
.stack { display: flex; flex-direction: column; gap: 20px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; text-align: left; font: inherit; color: inherit; }
button.tile { cursor: pointer; }
button.tile:hover { border-color: var(--ink-4); }
.tile .label { font-size: 13px; color: var(--ink-3); }
.tile .value { font-family: var(--font-display); font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tile .note { font-size: 12.5px; color: var(--ink-3); }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-head .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
.card-foot { border-top: 1px solid var(--line); padding-top: 10px; font-size: 13px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.empty { color: var(--ink-3); font-size: 14px; padding: 18px 0; text-align: center; display: grid; gap: 10px; justify-items: center; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* Rows */
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--grid); }
.row:first-child { border-top: 0; }
.row.click { cursor: pointer; border-radius: 6px; }
.row.click:hover { background: var(--surface-2); }
.row .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-size: 12.5px; color: var(--ink-3); }
.datebox { width: 42px; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 3px 0; line-height: 1.1; background: var(--surface-2); }
.datebox b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.datebox span { font-size: 10.5px; text-transform: uppercase; color: var(--ink-3); letter-spacing: .04em; }
.datebox.overdue { border-color: var(--bad); }
.dot { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }
.pill { font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 99px; white-space: nowrap; border: 1px solid var(--line); color: var(--ink-2); }
.pill.over { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.pill.close { color: var(--warn-ink); border-color: color-mix(in srgb, var(--warn) 60%, transparent); }
.pill.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.pill.auto { color: var(--ink-3); }

/* Meter */
.meter { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--grid); }
.meter > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.meter.over > i { background: var(--bad); }
.meter.close > i { background: var(--warn); }
.budget-row { display: grid; gap: 6px; padding: 9px 6px; border-top: 1px solid var(--grid); cursor: pointer; border-radius: 6px; }
.budget-row:first-child { border-top: 0; }
.budget-row:hover { background: var(--surface-2); }
.budget-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.budget-top .name { display: flex; align-items: center; gap: 8px; font-weight: 500; }

/* Loan */
.big { font-family: var(--font-display); font-size: 34px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.015em; line-height: 1.1; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; }
.kv div { display: grid; gap: 1px; }
.kv dt, .kv .k { font-size: 12.5px; color: var(--ink-3); }
.kv .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.slider-row { display: grid; grid-template-columns: 1fr 130px; gap: 14px; align-items: center; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12.5px; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
td.amt, th.amt { text-align: right; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.cat { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters input[type="search"] { flex: 1 1 200px; }

/* Charts */
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.chart-box { position: relative; height: 250px; }
.chart-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-3); font-size: 14px; padding: 0 20px; }
details.tableview summary { cursor: pointer; font-size: 13px; color: var(--ink-3); }
details.tableview table { margin-top: 8px; font-size: 13px; }

/* Plan */
.plan { display: grid; gap: 0; }
.plan-row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
.plan-row:first-child { border-top: 0; }
.plan-row.total { border-top: 2px solid var(--line); font-weight: 600; font-size: 16px; }

/* Preferences */
.pref { display: grid; grid-template-columns: 220px 1fr; gap: 18px; padding: 14px 0; border-top: 1px solid var(--grid); align-items: start; }
.pref:first-of-type { border-top: 0; }
.pref .label b { display: block; font-weight: 600; }
.pref .label span { font-size: 13px; color: var(--ink-3); }
.pref .ctl { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* House photo */
.house { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.house img { display: block; width: 100%; height: clamp(190px, 26vw, 340px); object-fit: cover; }
.house-overlay { position: absolute; left: 0; right: 0; bottom: 0; padding: 48px 20px 16px; background: linear-gradient(to top, rgb(0 0 0 / .7), rgb(0 0 0 / 0)); color: #fff; }
.house-overlay h2 { color: #fff; font-size: 22px; }
.house-overlay p { color: rgb(255 255 255 / .88); font-variant-numeric: tabular-nums; margin-top: 2px; }
.house-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; }
.house-actions .btn { background: rgb(0 0 0 / .5); color: #fff; border-color: rgb(255 255 255 / .35); }
.house-actions .btn:hover { background: rgb(0 0 0 / .7); }
.house-empty { border: 2px dashed var(--line); border-radius: var(--radius); background: var(--surface); padding: 26px 20px; display: grid; justify-items: center; gap: 8px; text-align: center; color: var(--ink-3); }
.house-empty b { color: var(--ink); font-size: 16px; }
.house-empty p { max-width: 46ch; }
.house.dragging, .house-empty.dragging { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }

/* Super */
.span2 { grid-column: 1 / -1; }
.super-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 18px; }
.super-strip > div { display: grid; gap: 2px; align-content: start; }
.super-strip .k, .fact .k { font-size: 12.5px; color: var(--ink-3); }
.big-sm { font-family: var(--font-display); font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.rate-row, .check-row { display: grid; gap: 12px; padding: 10px 0; border-top: 1px solid var(--grid); align-items: center; }
.rate-row { grid-template-columns: 1fr auto; }
.check-row { grid-template-columns: auto 1fr; align-items: start; }
.rate-row:first-child, .check-row:first-child { border-top: 0; }
.rate-ctl { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.rate-in { display: inline-flex; align-items: center; gap: 4px; }
.rate-in input { width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px 22px; }
.fact { display: grid; gap: 2px; align-content: start; }
.fact b { font-size: 17px; }
@media (max-width: 860px) { .super-strip { grid-template-columns: 1fr 1fr; } .rate-row { grid-template-columns: 1fr; } .rate-ctl { justify-content: flex-start; } }

/* Banner */
.banner { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--line)); background: color-mix(in srgb, var(--warn) 9%, var(--surface)); }
.banner p { max-width: 70ch; }

/* Dialog */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 0; width: min(460px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgb(0 0 0 / .25); }
dialog::backdrop { background: rgb(8 14 13 / .45); }
.form { padding: 20px 22px; display: grid; gap: 14px; }
.form h2 { font-size: 20px; }
.field { display: grid; gap: 5px; font-size: 13.5px; color: var(--ink-2); }
.field small { color: var(--ink-3); font-size: 12.5px; }
.field input, .field select { width: 100%; font-size: 15px; color: var(--ink); }
.field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.form-error { color: var(--bad); font-size: 13.5px; min-height: 0; }
.form-error:empty { display: none; }
.form-actions { display: flex; gap: 8px; align-items: center; }
.spacer { flex: 1; }

/* Toast */
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: none; gap: 14px; align-items: center; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 8px 30px rgb(0 0 0 / .25); z-index: 10; max-width: calc(100vw - 32px); }
#toast.show { display: flex; }
#toast button { background: none; border: 0; color: color-mix(in srgb, var(--accent) 60%, var(--surface)); font: 600 14px var(--font-body); cursor: pointer; padding: 0; }

@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.three { grid-template-columns: 1fr 1fr; } }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; align-items: center; padding: 10px 16px; gap: 12px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand b { display: none; }
  .nav { flex-direction: row; }
  .side-foot { display: none; }
  .main { padding: 20px 16px 60px; }
  .grid, .grid.three { grid-template-columns: 1fr; }
  .pref { grid-template-columns: 1fr; gap: 8px; }
}
@media (max-width: 460px) { .tiles { grid-template-columns: 1fr 1fr; gap: 10px; } .tile .value { font-size: 21px; } .field-pair { grid-template-columns: 1fr; } .row { grid-template-columns: auto 1fr auto; } .row .row-btn { grid-column: 2 / -1; justify-self: start; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="brand-mark" aria-hidden="true"><span></span></div><b>Budget Board</b></div>
    <nav class="nav" id="nav" aria-label="Pages">
      <a href="#overview" data-page="overview"><span class="nav-dot"></span>Overview</a>
      <a href="#transactions" data-page="transactions"><span class="nav-dot"></span>Transactions</a>
      <a href="#bills" data-page="bills"><span class="nav-dot"></span>Bills</a>
      <a href="#loan" data-page="loan"><span class="nav-dot"></span>Home loan</a>
      <a href="#super" data-page="super"><span class="nav-dot"></span>Super</a>
      <a href="#spending" data-page="spending"><span class="nav-dot"></span>Spending</a>
      <a href="#preferences" data-page="preferences"><span class="nav-dot"></span>Preferences</a>
    </nav>
    <div class="side-foot"><span id="sideSave"></span><span>Tip: every widget reads the same ledger, so paying a bill updates spending, totals and charts at once.</span></div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="pageTitle">Overview</h1><p id="pageSub"></p></div>
      <div class="top-actions"><span id="saveChip" class="chip">Loading…</span><button class="btn primary" id="addTxBtn" type="button">+ Add transaction</button></div>
    </header>
    <div id="banner"></div>
    <div id="page"></div>
  </main>
</div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script id="logic">
/* ===== Budget Board: pure logic (no DOM). Node can require this block for tests. ===== */
const BudgetLogic = (() => {
  // ---- Tweakable constants ----
  const UPCOMING_DAYS = 30;          // how far ahead the bills widget looks
  const SOON_DAYS = 14;              // "due soon" window for the summary tile
  const BUDGET_WARN = 0.9;           // spend/limit ratio that shows "Close to limit"
  const LOAN_MAX_YEARS = 40;         // forecast stops here if a loan never pays off
  const MAX_TRANSACTIONS = 5000;     // import/storage ceiling
  const SLOTS = 8;                   // categorical colour slots (9th+ folds into "Other")
  const PHOTO_MAX_CHARS = 3000000;   // largest house photo kept in the data (about 2 MB of image)

  const FREQS = {
    weekly: { label: 'Weekly', perYear: 52 },
    fortnightly: { label: 'Fortnightly', perYear: 26 },
    monthly: { label: 'Monthly', perYear: 12 },
    quarterly: { label: 'Quarterly', perYear: 4 },
    yearly: { label: 'Yearly', perYear: 1 },
    once: { label: 'One-off', perYear: 0 },
  };
  const LOAN_FREQS = ['weekly', 'fortnightly', 'monthly'];

  // ---- Dates (ISO yyyy-mm-dd, local time) ----
  function parseDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    if (d.getMonth() !== +m[2] - 1) return null;
    return d;
  }
  const pad = (n) => String(n).padStart(2, '0');
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return iso(d); }
  function addMonths(s, n) {
    const d = parseDate(s); const day = d.getDate();
    const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
    const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    t.setDate(Math.min(day, last)); return iso(t);
  }
  function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
  function advance(s, freq) {
    switch (freq) {
      case 'weekly': return addDays(s, 7);
      case 'fortnightly': return addDays(s, 14);
      case 'monthly': return addMonths(s, 1);
      case 'quarterly': return addMonths(s, 3);
      case 'yearly': return addMonths(s, 12);
      default: return null;
    }
  }
  function monthKey(s) { return String(s).slice(0, 7); }
  function monthBounds(today, back) { // back=0 → this month
    const d = parseDate(today); const f = new Date(d.getFullYear(), d.getMonth() - back, 1);
    const t = new Date(f.getFullYear(), f.getMonth() + 1, 0);
    return { from: iso(f), to: iso(t), key: iso(f).slice(0, 7), label: f.toLocaleString('en', { month: 'short' }) + (f.getMonth() === 0 || back === 0 ? ' ' + String(f.getFullYear()).slice(2) : '') };
  }
  function periodFrom(today, months) { return monthBounds(today, Math.max(0, months - 1)).from; }

  // ---- Money ----
  const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
  function monthlyEquivalent(amount, freq) { return round2((Number(amount) || 0) * (FREQS[freq] ? FREQS[freq].perYear : 0) / 12); }

  // ---- Bills ----
  function upcomingBills(bills, loan, today, days = UPCOMING_DAYS) {
    const end = addDays(today, days); const out = [];
    for (const b of bills) {
      if (!parseDate(b.nextDue)) continue;
      let d = b.nextDue; let i = 0;
      while (d && d <= end && i < 60) {
        out.push({ key: b.id + '@' + d, billId: b.id, name: b.name, amount: b.amount, date: d, categoryId: b.categoryId, autopay: !!b.autopay, first: i === 0, overdue: d < today });
        d = advance(d, b.frequency); i++;
      }
    }
    if (loan && loan.enabled && parseDate(loan.nextDue) && loan.balance > 0) {
      let d = loan.nextDue; let i = 0;
      while (d && d <= end && i < 60) {
        out.push({ key: 'loan@' + d, loan: true, name: loan.name || 'Home loan', amount: round2(loan.repayment + (loan.extra || 0)), date: d, categoryId: loan.categoryId, first: i === 0, overdue: d < today });
        d = advance(d, loan.frequency); i++;
      }
    }
    return out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.name.localeCompare(b.name));
  }
  function billsMonthlyTotal(bills) { return round2(bills.reduce((s, b) => s + monthlyEquivalent(b.amount, b.frequency), 0)); }

  // ---- Home loan ----
  function periodRate(rate, freq) { return (Number(rate) || 0) / 100 / FREQS[freq].perYear; }
  function minRepayment(balance, rate, years, freq) {
    const n = Math.round(years * FREQS[freq].perYear); const r = periodRate(rate, freq);
    if (n <= 0 || balance <= 0) return Math.max(0, balance);
    if (r === 0) return round2(balance / n);
    return round2(balance * r / (1 - Math.pow(1 + r, -n)));
  }
  function periodInterest(balance, offset, rate, freq) { return Math.max(0, balance - Math.max(0, offset || 0)) * periodRate(rate, freq); }
  function applyRepayment(loan, amount) {
    const interest = round2(periodInterest(loan.balance, loan.offset, loan.rate, loan.frequency));
    const principal = round2(Math.min(loan.balance, amount - interest));
    return { interest, principal, balanceAfter: round2(loan.balance - principal) };
  }
  function projectLoan(loan, extraOverride) {
    const extra = extraOverride == null ? (loan.extra || 0) : extraOverride;
    const per = FREQS[loan.frequency].perYear; const pay = (loan.repayment || 0) + extra;
    let bal = loan.balance; let totalInterest = 0; let n = 0; let date = parseDate(loan.nextDue) ? loan.nextDue : null;
    const start = date || '2000-01-01';
    const points = [{ date: start, balance: round2(bal) }];
    const maxN = per * LOAN_MAX_YEARS;
    while (bal > 0.005 && n < maxN) {
      const i = periodInterest(bal, loan.offset, loan.rate, loan.frequency);
      if (pay <= i && n === 0) return { paysOff: false, periods: Infinity, totalInterest: Infinity, payoffDate: null, points };
      totalInterest += i; bal = bal + i - pay; n++;
      date = advance(date || start, loan.frequency);
      if (n % per === 0 || bal <= 0.005) points.push({ date, balance: round2(Math.max(0, bal)) });
    }
    const paysOff = bal <= 0.005;
    return { paysOff, periods: paysOff ? n : Infinity, totalInterest: paysOff ? round2(totalInterest) : Infinity, payoffDate: paysOff ? date : null, points };
  }

  // ---- Transactions & aggregates ----
  function inRange(t, from, to) { return t.date >= from && t.date <= to; }
  function totals(txns, from, to) {
    let moneyIn = 0, moneyOut = 0;
    for (const t of txns) if (inRange(t, from, to)) { if (t.amount >= 0) moneyIn += t.amount; else moneyOut -= t.amount; }
    return { moneyIn: round2(moneyIn), moneyOut: round2(moneyOut), net: round2(moneyIn - moneyOut) };
  }
  function spendByCategory(txns, from, to) {
    const m = {};
    for (const t of txns) if (t.amount < 0 && inRange(t, from, to)) m[t.categoryId] = round2((m[t.categoryId] || 0) - t.amount);
    return m;
  }
  function cashflow(txns, today, months) {
    const out = [];
    for (let b = months - 1; b >= 0; b--) { const mb = monthBounds(today, b); out.push(Object.assign({ label: mb.label, key: mb.key }, totals(txns, mb.from, mb.to))); }
    return out;
  }
  function budgetStatus(spent, limit) {
    if (!limit) return 'none';
    const r = spent / limit; return r > 1 ? 'over' : r >= BUDGET_WARN ? 'close' : 'ok';
  }
  function summary(state, today) {
    const mb = monthBounds(today, 0); const t = totals(state.transactions, mb.from, mb.to);
    const soonEnd = addDays(today, SOON_DAYS);
    const soon = upcomingBills(state.bills, state.loan, today, SOON_DAYS).filter((u) => u.date <= soonEnd);
    const loanMonthly = state.loan && state.loan.enabled ? monthlyEquivalent(state.loan.repayment + (state.loan.extra || 0), state.loan.frequency) : 0;
    const billsMonthly = billsMonthlyTotal(state.bills);
    const budgets = round2(state.categories.filter((c) => c.kind === 'spend').reduce((s, c) => s + (Number(c.limit) || 0), 0));
    const income = Number(state.settings.monthlyIncome) || 0;
    return Object.assign({}, t, { soonTotal: round2(soon.reduce((s, u) => s + u.amount, 0)), soonCount: soon.length, loanMonthly, billsMonthly, budgets, income, unallocated: round2(income - loanMonthly - billsMonthly - budgets) });
  }

  // ---- Colour slots: fixed per category, never by rank ----
  function nextSlot(categories) {
    const used = new Set(categories.map((c) => c.slot));
    for (let s = 1; s <= SLOTS; s++) if (!used.has(s)) return s;
    return 0; // 0 = "Other" grey
  }

  // ---- Chart data builder: spec → labels + series (no DOM) ----
  const CHART_SOURCES = {
    cashflow: { label: 'Money in vs money out, by month', types: ['bar', 'line'], period: true },
    byCategory: { label: 'Spending by category', types: ['hbar', 'doughnut'], period: true },

      el('div', { class: 'facts' }, items.map((x) => el('div', { class: 'fact' },
        el('span', { class: 'k', text: x.label }), el('b', { class: 'num', text: fmtV(x) }), el('span', { class: 'muted small', text: x.note + ' ' }), el('a', { href: x.url, target: '_blank', rel: 'noopener noreferrer', class: 'small', text: x.source }))),
        el('div', { class: 'fact' }, el('span', { class: 'k', text: f.asfa.label }), el('b', { class: 'num', text: money(f.asfa.single.lump, 'whole') + ' single · ' + money(f.asfa.couple.lump, 'whole') + ' couple' }),
          el('span', { class: 'muted small', text: f.asfa.note + ' ' }), el('a', { href: f.asfa.url, target: '_blank', rel: 'noopener noreferrer', class: 'small', text: f.asfa.source }))),
      el('p', { class: 'muted small', text: 'This is general information, not financial advice. For advice about your situation, talk to a licensed financial adviser or your fund.' }));
  }

  function pageSpending() {
    const s = L.summary(state, today());
    const planRow = (label, v, cls) => el('div', { class: 'plan-row ' + (cls || '') }, el('span', { text: label }), el('span', { class: v < 0 && cls === 'total' ? 'neg' : '', text: (v < 0 ? '−' : '') + money(Math.abs(v), 'whole') }));
    const plan = card('Monthly plan', 'Where a typical month’s income is meant to go', btn('Edit income', incomeForm, 'small ghost'),
      el('div', { class: 'plan' }, planRow('Income target', s.income), planRow('Home loan repayments', -s.loanMonthly), planRow('Bills (monthly average)', -s.billsMonthly), planRow('Spending budgets', -s.budgets), planRow(s.unallocated >= 0 ? 'Not yet allocated' : 'Over-allocated', s.unallocated, 'total')),
      el('p', { class: 'muted small', text: s.unallocated >= 0 ? 'Room for savings, extra loan repayments or a new budget.' : 'Your plan spends more than your income target. Trim a budget or check your bills.' }));
    const mb = L.monthBounds(today(), 0); const spent = L.spendByCategory(state.transactions, mb.from, mb.to);
    const catTable = el('div', { class: 'table-wrap' }, el('table', null,
      el('thead', null, el('tr', null, el('th', { text: 'Category' }), el('th', { text: 'Used for' }), el('th', { class: 'amt', text: 'Monthly budget' }), el('th', { class: 'amt', text: 'Spent this month' }), el('th', { text: 'Status' }))),
      el('tbody', null, state.categories.map((c) => {
        const sp = spent[c.id] || 0; const st = L.budgetStatus(sp, c.limit);
        return el('tr', { class: 'click', tabindex: '0', onclick: () => categoryForm(c), onkeydown: (e) => { if (e.key === 'Enter') categoryForm(c); } },
          el('td', null, catLabel(c.id)), el('td', { class: 'muted', text: c.kind === 'spend' ? 'Spending' : c.kind === 'income' ? 'Income' : 'Home loan' }),
          el('td', { class: 'amt', text: c.limit ? money(c.limit, 'whole') : '—' }), el('td', { class: 'amt', text: c.kind === 'income' ? '—' : money(sp, 'whole') }),
          el('td', null, st === 'over' ? el('span', { class: 'pill over', text: '▲ Over' }) : st === 'close' ? el('span', { class: 'pill close', text: '● Close to limit' }) : st === 'ok' ? el('span', { class: 'pill ok', text: '✓ On track' }) : el('span', { class: 'muted small', text: c.kind === 'spend' ? 'No limit' : '' })));
      }))));
    return el('div', { class: 'stack' },
      el('div', { class: 'grid' }, card('This month by category', 'Click a category to set its budget', null, budgetRows(true)), plan),
      card('Categories', 'Colours stay with a category in every chart', btn('+ Add category', () => categoryForm(), 'primary small'), catTable),
      el('div', { class: 'charts' }, chartCard({ id: 'fixed-bva', title: 'Budget vs spent, this month', source: 'budgetVsActual', type: 'hbar', months: 0 }, { fixed: true }), chartCard({ id: 'fixed-trend', title: 'Top categories over 6 months', source: 'categoryTrend', type: 'line', months: 6 }, { fixed: true })));
  }
  function incomeForm() {
    openForm({ title: 'Monthly income target', intro: 'Your usual take-home pay per month. It’s used for the monthly plan; actual income comes from your transactions.',
      fields: [{ id: 'income', label: 'Take-home pay per month', type: 'number', step: '1', min: '0', value: state.settings.monthlyIncome || '' }],
      onSubmit: (v) => { if (!moneyOk(v.income)) return 'Enter an amount of zero or more.'; commit((s) => { s.settings.monthlyIncome = L.round2(v.income); }, 'Income target updated'); } });
  }

  function seg(options, value, onPick, label) {
    return el('div', { class: 'seg', role: 'group', 'aria-label': label }, options.map(([v, text]) => el('button', { type: 'button', 'aria-pressed': String(v === value), text, onclick: () => onPick(v) })));
  }
  function pagePreferences() {
    const theme = lsGet(LS.theme) || 'auto'; const accentMode = lsGet(LS.accentMode) === 'custom' ? 'custom' : lsGet(LS.accentMode) === 'windows' && HOST ? 'windows' : 'teal'; const custom = validHex(lsGet(LS.accentCustom)) || TEAL;
    const colour = el('input', { id: 'accentPick', type: 'color', value: custom, 'aria-label': 'Custom accent colour' });
    colour.addEventListener('input', () => { document.documentElement.style.setProperty('--accent', colour.value); document.documentElement.style.setProperty('--accent-ink', inkFor(colour.value)); });
    colour.addEventListener('change', () => { lsSet(LS.accentCustom, colour.value); applyAccent(); render(); });
    const curSel = el('select', { id: 'currency', onchange: (e) => commit((s) => { s.settings.currency = e.target.value; }, 'Currency changed to ' + e.target.value, { noUndo: true }) }, Object.keys(CURRENCIES).map((c) => el('option', { value: c, text: c })));
    curSel.value = state.settings.currency;
    const fileIn = el('input', { id: 'importFile', type: 'file', accept: '.json,application/json', style: 'display:none', onchange: (e) => importFile(e.target.files && e.target.files[0]) });
    let armed = false; const erase = btn('Erase everything', () => {
      if (!armed) { armed = true; erase.textContent = 'Click again to erase'; erase.classList.add('armed'); setTimeout(() => { armed = false; erase.textContent = 'Erase everything'; erase.classList.remove('armed'); }, 4000); return; }
      const cur = state.settings.currency; commit((s) => { Object.assign(s, L.emptyState()); s.settings.currency = cur; }, 'Everything erased');
    }, 'danger');
    const pref = (title, note, ...ctl) => el('div', { class: 'pref' }, el('div', { class: 'label' }, el('b', { text: title }), note ? el('span', { text: note }) : null), el('div', { class: 'ctl' }, ...ctl));
    const where = state.isExample ? 'You’re looking at example data, which isn’t saved.' : HOST ? 'Saved to a file on this PC after every change. Nothing is sent anywhere.' : fileStatus === 'connected' ? 'Saved to ' + fileName() + ' on this PC, with a copy in this browser. Nothing is sent anywhere.' : 'Saved in this browser only. Connect a data file so it lives in a file you can back up.';
    const fileCtl = HOST
      ? [el('code', { class: 'small', style: 'overflow-wrap:anywhere', text: desktop.path || '…' }), btn('Show in folder', () => HOST.postMessage({ type: 'reveal' }), 'small'), btn('Move it to…', () => HOST.postMessage({ type: 'moveFile' }), 'small'), btn('Open a different file…', () => HOST.postMessage({ type: 'openFile' }), 'small ghost')]
      : !FS_OK
      ? [el('span', { class: 'muted small', text: 'This browser can’t save straight to a file. Open Budget Board in Edge or Chrome for that; here, use Download backup now and then.' })]
      : fileStatus === 'connected' ? [el('span', { class: 'chip ok', text: fileName() }), btn('Use a different file…', openDataFile, 'small'), btn('Stop saving to file', forgetFile, 'small ghost')]
        : fileStatus === 'needs-permission' ? [btn('Reconnect ' + fileName(), reconnectFile, 'small primary'), btn('Forget it', forgetFile, 'small ghost')]
          : [btn('Create a new data file…', createDataFile, 'small primary'), btn('Open an existing data file…', openDataFile, 'small'), fileError ? el('span', { class: 'neg small', text: fileError }) : null];
    return el('div', { class: 'stack' },
      card('Appearance', null, null,
        pref('Theme', 'Auto follows your Windows light or dark setting.', seg([['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']], theme, (v) => { lsSet(LS.theme, v); applyTheme(); render(); }, 'Theme')),
        pref('Accent colour', HOST ? 'Windows uses the accent colour from your Windows settings and follows it when it changes.' : 'A browser page can’t read your Windows accent colour, so pick one here.', seg((HOST ? [['windows', 'Windows']] : []).concat([['teal', 'Budget Board teal'], ['custom', 'Custom']]), accentMode, (v) => { lsSet(LS.accentMode, v); applyAccent(); render(); }, 'Accent'), accentMode === 'custom' ? colour : null)),
      card('Money', null, null,
        pref('Currency', 'Changes how amounts are shown. It doesn’t convert them.', curSel),
        pref('Income target', 'Used by the monthly plan on the Spending page.', el('span', { class: 'num', text: money(state.settings.monthlyIncome, 'whole') + ' a month' }), btn('Change', incomeForm, 'small'))),
      card('Your data', where, null,
        pref('Data file', HOST ? 'Budget Board reads this file when it opens and writes it after every change. A dated copy goes in the Backups folder next to it each day (the last 14 are kept).' : 'A .json file on your PC that Budget Board reads when it opens and writes after every change. Put it in Documents or OneDrive to back it up.', ...fileCtl),
        pref('Backup', 'A file with everything: transactions, bills, loan, budgets and charts.', btn('Download backup', () => saveFile('budget-board-backup-' + today() + '.json', JSON.stringify(Object.assign({}, state, { isExample: false }), null, 1)), 'small'), btn('Copy backup', () => copyText(JSON.stringify(state), 'Backup copied. Paste it into a text file to keep it.'), 'small')),
        pref('Restore', 'Load a backup file. It’s read on this PC and replaces what’s here (you can undo).', btn('Choose backup file…', () => fileIn.click(), 'small'), fileIn),
        pref('Transactions', 'For spreadsheets.', btn('Copy as CSV', copyCSV, 'small'), btn('Download CSV', () => saveFile('budget-transactions-' + today() + '.csv', L.toCSV(state)), 'small')),
        HOST && desktop.version ? pref('About', null, el('span', { class: 'muted', text: 'Budget Board ' + desktop.version })) : null,
        pref('Start over', null, btn('Load example data', () => commit((s) => { Object.assign(s, L.exampleState(today())); }, 'Example data loaded'), 'small'), erase)));
  }

  // ---- Data in/out ----
  async function copyText(text, ok) { try { await navigator.clipboard.writeText(text); toast(ok); } catch (e) { toast('Couldn’t copy: your browser blocked the clipboard.'); } }
  function copyCSV() { copyText(L.toCSV(state), 'Copied ' + state.transactions.length + ' transactions as CSV'); }
  function saveFile(filename, data) {
    if (HOST) { HOST.postMessage({ type: 'export', kind: filename.endsWith('.csv') ? 'csv' : 'json', data }); return; }
    try {
      const url = URL.createObjectURL(new Blob([data], { type: filename.endsWith('.csv') ? 'text/csv' : 'application/json' }));
      const a = el('a', { href: url, download: filename }); document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    } catch (e) { toast('The download didn’t start. Use Copy instead.'); }
  }
  function importFile(file) {
    if (!file) return;
    if (file.size > IMPORT_MAX_BYTES) { toast('That file is over 20 MB, which is too big for a Budget Board backup.'); return; }
    const r = new FileReader();
    r.onload = () => {
      try { const next = L.normaliseState(JSON.parse(String(r.result))); next.isExample = false; commit((s) => { Object.assign(s, next); }, 'Backup restored: ' + next.transactions.length + ' transactions'); }
      catch (e) { toast('That file couldn’t be read as a Budget Board backup.'); }
    };
    r.onerror = () => toast('That file couldn’t be opened.');
    r.readAsText(file);
  }

  // ---- Theme & accent ----
  const hostTheme = document.documentElement.getAttribute('data-theme');
  function validHex(v) { return /^#[0-9a-fA-F]{6}$/.test(v || '') ? v : null; }
  function inkFor(hex) {
    const n = parseInt(hex.slice(1), 16); const ch = [n >> 16, (n >> 8) & 255, n & 255].map((c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    const lum = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2]; return lum > 0.4 ? '#0b1312' : '#ffffff';
  }
  let applyingTheme = false;
  function applyTheme() {
    const t = lsGet(LS.theme) || 'auto'; applyingTheme = true;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else if (hostTheme) document.documentElement.setAttribute('data-theme', hostTheme); else document.documentElement.removeAttribute('data-theme');
    applyingTheme = false;
  }
  function applyAccent() {
    const root = document.documentElement; const mode = lsGet(LS.accentMode);
    const c = mode === 'windows' && HOST ? (validHex(desktop.windowsAccent) || TEAL) : (validHex(lsGet(LS.accentCustom)) || TEAL);
    if (mode === 'custom' || (mode === 'windows' && HOST && validHex(desktop.windowsAccent))) { root.style.setProperty('--accent', c); root.style.setProperty('--accent-ink', inkFor(c)); }
    else { root.style.removeProperty('--accent'); root.style.removeProperty('--accent-ink'); }
  }
  let themeTimer = null;
  const redrawSoon = () => { clearTimeout(themeTimer); themeTimer = setTimeout(render, 60); };
  new MutationObserver(() => {
    if (applyingTheme) return;
    const t = lsGet(LS.theme) || 'auto'; const cur = document.documentElement.getAttribute('data-theme');
    if ((t === 'light' || t === 'dark') && cur !== t) { applyTheme(); return; }
    redrawSoon();
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawSoon); } catch (e) { /* old browser */ } }

  // ---- Render & routing ----
  const RENDER = { overview: pageOverview, transactions: pageTransactions, bills: pageBills, loan: pageLoan, super: pageSuper, spending: pageSpending, preferences: pagePreferences };
  function currentPage() { const h = location.hash.slice(1); return RENDER[h] ? h : 'overview'; }
  function render() {
    const page = currentPage(); destroyCharts();
    for (const a of document.querySelectorAll('#nav a')) { if (a.dataset.page === page) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }
    $('pageTitle').textContent = PAGES[page].title; $('pageSub').textContent = PAGES[page].sub;
    const banner = $('banner'); banner.replaceChildren();
    if (state.isExample) banner.append(el('div', { class: 'banner', role: 'note' },
      el('p', null, el('b', { text: 'You’re exploring example data. ' }), 'Try paying a bill or adding a transaction and watch every widget update. Nothing is saved until you choose.'),
      el('div', { class: 'top-actions' }, btn('Keep the examples and save', () => commit((s) => { s.isExample = false; }, 'Example data kept. Changes now save.', { noUndo: true })),
        btn('Start with my own data', () => { const cur = state.settings.currency; commit((s) => { Object.assign(s, L.emptyState()); s.settings.currency = cur; }, 'Fresh start. Add your loan, bills and first transactions.'); goto('overview'); }, 'primary'))));
    else if (fileStatus === 'needs-permission') banner.append(el('div', { class: 'banner', role: 'note' },
      el('p', null, el('b', { text: 'Reconnect your data file. ' }), 'Your browser asks once per visit before Budget Board can open ' + fileName() + ' again. Until then, changes are kept in this browser and written to the file when you reconnect.'),
      el('div', { class: 'top-actions' }, btn('Reconnect ' + fileName(), reconnectFile, 'primary'))));
    else if (fileStatus === 'none' && FS_OK && !lsGet('budgetboard.fileTipDismissed')) banner.append(el('div', { class: 'banner', role: 'note' },
      el('p', null, el('b', { text: 'Your data is only in this browser. ' }), 'Save it to a file on your PC so clearing browser data can’t wipe it.'),
      el('div', { class: 'top-actions' }, btn('Not now', () => { lsSet('budgetboard.fileTipDismissed', '1'); render(); }, 'ghost'), btn('Open existing file…', openDataFile), btn('Create data file…', createDataFile, 'primary'))));
    const node = RENDER[page]();
    $('page').replaceChildren(node);
    drawPending(); setChip(); sendAppearance();
  }
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
  $('addTxBtn').addEventListener('click', () => txForm());
  $('dlg').addEventListener('click', (e) => { if (e.target === $('dlg')) $('dlg').close(); });

  // ---- Start ----
  applyTheme(); applyAccent();
  // Test helpers: ?page=bills and ?theme=dark open straight to a page or theme.
  try {
    const q = new URLSearchParams(location.search);
    if (RENDER[q.get('page')] && !location.hash) history.replaceState(null, '', '#' + q.get('page'));
    if (q.get('theme') === 'light' || q.get('theme') === 'dark') document.documentElement.setAttribute('data-theme', q.get('theme'));
  } catch (e) { /* ignore */ }
  state = loadLocal() || L.exampleState(today()); sortTx();
  render();
  if (HOST) { HOST.addEventListener('message', (e) => onHostMessage(e.data)); HOST.postMessage({ type: 'ready' }); setChip(); }
  else initFile();
})();

</script>
</body>
